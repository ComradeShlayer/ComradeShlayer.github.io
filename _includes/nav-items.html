{% if site.pages %}
  <nav class="site-nav">
    <ul class="nav-list">
      {% assign pages_list = site.pages | sort: "title" %}
      {% for page in pages_list %}
        {% if page.title and page.nav_exclude != true %}
          <li class="nav-item">
            <a class="nav-link" href="{{ page.url | relative_url }}">
              {{ page.title }}
            </a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
{% endif %}
